name: Config & Doctrine Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install json5 pyyaml

      - name: Check opencode.jsonc matches models.yaml
        run: make check-config

      - name: Run agent model audit
        run: make audit

      - name: Check v8.0 doctrine compliance (skills/ agents/ profiles/)
        run: make check-doctrine
